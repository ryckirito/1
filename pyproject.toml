[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-report"
version = "0.2.0"
description = "美股每日异动扫描与推荐建仓日报生成器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "jinja2>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
daily-report = "daily_report.cli:main"

[tool.setuptools.packages.find]
include = ["daily_report*"]

[tool.setuptools.package-data]
daily_report = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
